<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0D16"/>
      <stop offset="0.55" stop-color="#19132A"/>
      <stop offset="1" stop-color="#28133D"/>
    </linearGradient>
    <linearGradient id="purple" x1="100" y1="100" x2="850" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E1C7FF"/>
      <stop offset="0.5" stop-color="#A875E8"/>
      <stop offset="1" stop-color="#7041A6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#A855F7" stop-opacity=".32"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C6A7F2" opacity=".22"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 820px 170px; }
      .orbit { animation: rotate 18s linear infinite; transform-origin: 820px 170px; }
      .float { animation: float 4s ease-in-out infinite; }
      .shine { animation: shine 5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.96); } 50% { opacity:1; transform:scale(1.04); } }
      @keyframes rotate { to { transform:rotate(360deg); } }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
      @keyframes shine { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1000" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="24" fill="url(#dots)"/>
  <circle cx="820" cy="170" r="190" fill="url(#glow)"/>
  <circle cx="130" cy="30" r="130" fill="url(#glow)" opacity=".45"/>

  <rect x="24" y="24" width="952" height="312" rx="18" stroke="#A875E8" stroke-opacity=".35"/>
  <path d="M45 76 H955" stroke="#A875E8" stroke-opacity=".22"/>
  <path d="M45 300 H955" stroke="#A875E8" stroke-opacity=".22"/>

  <g fill="#C6A7F2" font-family="monospace" font-size="11" letter-spacing="2">
    <text x="55" y="57">SOFTWARE ENGINEERING • CREATIVE TECHNOLOGY</text>
    <text x="780" y="57">PORTFOLIO / 2026</text>
  </g>

  <g class="float">
    <text x="58" y="137" fill="#EADFFF" font-family="Georgia, serif" font-size="43" font-weight="bold">ALYAMAMAH</text>
    <text x="58" y="187" fill="url(#purple)" font-family="Georgia, serif" font-size="43" font-weight="bold">AHMAD.</text>

    <text x="60" y="222" fill="#E7D8FC" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Full-Stack Developer</text>
    <text x="60" y="248" fill="#C6A7F2" font-family="Arial, sans-serif" font-size="17" font-weight="bold">UI/UX Designer</text>
    <text x="60" y="275" fill="#C7BED6" font-family="Arial, sans-serif" font-size="13">Software Engineering Graduate</text>
  </g>

  <path d="M60 290 H540" stroke="url(#purple)" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 290 H220" stroke="#F0DFFF" stroke-width="2" stroke-linecap="round" class="shine"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#E5D6F8">
    <text x="60" y="318" font-style="italic">Where ideas meet code &amp; creativity.</text>
  </g>

  <g class="pulse">
    <circle cx="820" cy="170" r="103" stroke="#A875E8" stroke-width="1.5" stroke-opacity=".65"/>
    <circle cx="820" cy="170" r="82" stroke="#C6A7F2" stroke-width="1" stroke-dasharray="4 8" opacity=".7"/>
    <circle cx="820" cy="170" r="59" stroke="url(#purple)" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M790 170 L810 190 L851 143" stroke="#EADFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="orbit">
    <circle cx="820" cy="67" r="5" fill="#E1C7FF" filter="url(#softGlow)"/>
    <circle cx="923" cy="170" r="4" fill="#A875E8"/>
    <circle cx="820" cy="273" r="5" fill="#C6A7F2"/>
  </g>

  <g class="shine" fill="#DCC5FF">
    <path d="M920 90 L925 103 L938 108 L925 113 L920 126 L915 113 L902 108 L915 103 Z"/>
    <circle cx="710" cy="260" r="3"/>
    <circle cx="940" cy="245" r="2"/>
  </g>

  <text x="820" y="316" text-anchor="middle" fill="#B99AE0" font-family="monospace" font-size="10" letter-spacing="3">DESIGN • DEVELOP • INNOVATE</text>
</svg>
