<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0B15"/>
      <stop offset="0.5" stop-color="#171225"/>
      <stop offset="1" stop-color="#0D0C18"/>
    </linearGradient>
    <linearGradient id="name" x1="280" y1="100" x2="720" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E9FF"/>
      <stop offset=".5" stop-color="#C6A7F2"/>
      <stop offset="1" stop-color="#9870D1"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#7041A6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7041A6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .reveal { animation: reveal 1.5s ease-out both; }
      .fade { animation: fade 4s ease-in-out infinite; }
      .line { animation: line 3s ease-in-out infinite; }
      @keyframes reveal {
        from { opacity:0; transform:translateY(12px); }
        to { opacity:1; transform:translateY(0); }
      }
      @keyframes fade {
        0%,100% { opacity:.35; }
        50% { opacity:1; }
      }
      @keyframes line {
        0%,100% { transform:scaleX(.65); opacity:.5; }
        50% { transform:scaleX(1); opacity:1; }
      }
    </style>
  </defs>

  <rect width="1000" height="340" rx="22" fill="url(#background)"/>
  <ellipse cx="500" cy="145" rx="400" ry="180" fill="url(#ambient)"/>

  <path d="M35 35H965V305H35Z" stroke="#A875E8" stroke-opacity=".13" rx="16"/>
  <path d="M70 35H180" stroke="#A875E8" stroke-width="1.5" opacity=".7"/>
  <path d="M820 305H930" stroke="#A875E8" stroke-width="1.5" opacity=".7"/>

  <g class="reveal" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="500" y="91" fill="#B99AE0" font-size="12" letter-spacing="4">
      SOFTWARE ENGINEERING GRADUATE
    </text>

    <text x="500" y="153" fill="url(#name)" font-size="47" font-weight="bold" letter-spacing="1">
      ALYAMAMAH AHMAD.
    </text>

    <text x="500" y="195" fill="#E8DDF8" font-size="19" font-weight="600">
      Full-Stack Developer
    </text>

    <text x="500" y="224" fill="#C6A7F2" font-size="18">
      UI/UX Designer
    </text>

    <rect x="430" y="244" width="140" height="2" rx="1" fill="#7041A6" class="line"/>

    <text x="500" y="277" fill="#D8CBE8" font-size="16" font-style="italic">
      Where ideas meet code &amp; creativity.
    </text>

    <text x="500" y="320" fill="#9879BB" font-size="10" letter-spacing="4" class="fade">
      DESIGN  •  DEVELOP  •  INNOVATE
    </text>
  </g>

  <g fill="#C6A7F2" class="fade">
    <circle cx="105" cy="110" r="2"/>
    <circle cx="895" cy="110" r="2"/>
    <circle cx="150" cy="260" r="1.5"/>
    <circle cx="850" cy="260" r="1.5"/>
  </g>
</svg>
